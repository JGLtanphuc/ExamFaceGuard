<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Hệ Thống Giám Sát Thi Chống Thi Hộ</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <img src="/static/images/logo.jpg" alt="HUIT Logo" class="brand-logo">
      <div class="brand-title-group">
        <span class="brand-school">Trường Đại học Công Thương TP. Hồ Chí Minh</span>
        <span class="brand-system">Hệ Thống Giám Sát Thi Trực Tuyến</span>
      </div>
    </div>
  </header>

  <main class="login-wrapper">
    <!-- Cinematic Ken Burns Background Image -->
    <div class="login-bg-media"></div>
    <div class="login-bg-overlay"></div>

    <!-- Floating Ambient Light Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Ambient Sparkles Particle Canvas -->
    <canvas id="particles-canvas" class="particles-canvas"></canvas>

    <!-- Glassmorphic Login Card -->
    <div class="login-card" id="login-card">
      <div class="login-logo-wrap">
        <img src="/static/images/logo.jpg" alt="HUIT Logo" class="login-school-logo">
      </div>

      <div class="login-header">
        <div class="login-school-title">Trường Đại học Công Thương TP.HCM</div>
        <h1>ĐĂNG NHẬP HỆ THỐNG</h1>
        <p>Cổng xác thực sinh viên & giám thị phòng thi</p>
      </div>

      <div id="client-error-box" class="alert-error" style="display: none; margin-bottom: 1rem;"></div>

      {% if error %}
      <div id="server-error-box" class="alert-error" style="margin-bottom: 1rem;">
        <strong>Lỗi:</strong> {{ error }}
      </div>
      {% endif %}

      <form id="login-form" action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="ten_dang_nhap">Tên đăng nhập / Mã số sinh viên</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="ten_dang_nhap"
              name="ten_dang_nhap"
              class="form-input"
              placeholder="Nhập tên đăng nhập hoặc MSSV"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="mat_khau">Mật khẩu</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="mat_khau"
              name="mat_khau"
              class="form-input"
              placeholder="Nhập mật khẩu"
              required
            >
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-login-submit">
          <span>Đăng Nhập Vào Hệ Thống</span>
          <svg style="width: 18px; height: 18px; transition: transform 0.2s;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="footer-school-credit">
        © Bản quyền thuộc Trường Đại học Công Thương TP. Hồ Chí Minh
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Subtle Floating Sparkles Canvas Animation
      const canvas = document.getElementById("particles-canvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        let particles = [];
        const count = 35;

        function resize() {
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2.2 + 0.8,
            speedY: Math.random() * 0.4 + 0.15,
            speedX: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.6 + 0.2,
            pulse: Math.random() * 0.02 + 0.01
          });
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.y -= p.speedY;
            p.x += p.speedX;
            p.opacity += Math.sin(Date.now() * 0.002) * 0.005;

            if (p.y < 0) {
              p.y = canvas.height + 10;
              p.x = Math.random() * canvas.width;
            }
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(186, 230, 253, ${Math.max(0.1, Math.min(0.8, p.opacity))})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(56, 189, 248, 0.6)";
            ctx.fill();
          });
          requestAnimationFrame(animate);
        }
        animate();
      }

      // 2. Interactive 3D Card Tilt Effect on Mouse Move
      const card = document.getElementById("login-card");
      if (card && window.matchMedia("(min-width: 768px)").matches) {
        const wrapper = document.querySelector(".login-wrapper");
        wrapper.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const cardCenterX = rect.left + rect.width / 2;
          const cardCenterY = rect.top + rect.height / 2;
          const mouseX = e.clientX - cardCenterX;
          const mouseY = e.clientY - cardCenterY;

          // Limit tilt angle to max 8 deg
          const rotateX = (-mouseY / (rect.height / 2)) * 7;
          const rotateY = (mouseX / (rect.width / 2)) * 7;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
        });

        wrapper.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)";
        });
      }

      function showError(msg) {
        if (serverErrorBox) serverErrorBox.style.display = "none";
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        if (serverErrorBox) serverErrorBox.style.display = "none";

        submitBtn.disabled = true;
        submitBtn.textContent = "Đang kiểm tra thông tin...";

        const formData = new FormData(form);

        try {
          const res = await fetch("/login", {
            method: "POST",
            body: formData,
            headers: {
              "X-Requested-With": "XMLHttpRequest",
              "Accept": "application/json"
            }
          });

          const data = await res.json();

          if (res.ok && data.success) {
            if (data.token) {
              localStorage.setItem("access_token", data.token);
              sessionStorage.setItem("access_token", data.token);
            }
            submitBtn.textContent = "Đăng nhập thành công! Đang chuyển hướng...";

            // Nếu đang trên mobile và truy cập HTTP, ưu tiên chuyển sang HTTPS (cổng 8443) để mở camera realtime
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile && window.location.protocol === "http:") {
              window.location.href = `https://${window.location.hostname}:8443${data.redirect_url}`;
            } else {
              window.location.href = data.redirect_url;
            }
          } else {
            showError(data.error || "Tên đăng nhập hoặc mật khẩu không chính xác.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Đăng Nhập";
          }
        } catch (err) {
          console.error("Lỗi fetch /login:", err);
          form.submit();
        }
      });
    });
  </script>
</body>
</html>
